; ESP32-2432S028R ("CYD", 2.8" 240x320, plain ESP32-WROOM-32, NO PSRAM) - PC MONITOR + PC REMOTE (one firmware)
; Files: src/main.cpp  src/display.h  src/touch.h  src/webui.h
; Touch = the real XPT2046_Touchscreen library (same as the working remote-only build), time-shared with the SD card on VSPI.
; If touch ever misbehaves, try env:cyd_touch_bitbang (software SPI, no library).
[platformio]
default_envs = cyd_deck_fast

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; after a crash the serial monitor turns "Backtrace: 0x4008...:0x3ffb..." into file:line (needs the firmware.elf of the SAME build)
monitor_filters = esp32_exception_decoder, time

; CYD = 4 MB flash. Plain 4 MB table with big app slot (no OTA)
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_build.filesystem = littlefs        ; button icons are stored in LittleFS (partition label spiffs)

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.0.4
    bodmer/TJpg_Decoder@^1.1.0
    bitbank2/AnimatedGIF@^2.1.1
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
    ; ---- microSD slot on the CYD (own VSPI bus) ----
    -DSD_USE_SPI
    -DSD_SPI_BUS=VSPI
    -DSD_SCK=18
    -DSD_MISO=19
    -DSD_MOSI=23
    -DSD_CS=5
    ; SD card SPI speed: 20 MHz = 2.5 MB/s is far more than a 320x240 MJPEG needs, and runs cooler / more reliably than 40 MHz
    -DSD_SPI_HZ=20000000
    ; ---- inputs: the CYD has almost no free pins ----
    ; GPIO0 (BOOT button) = page button (short press = next page, 1-4 s = auto-rotate, >4 s = WiFi setup)
    ; optional rotary encoder on the free pins of the P3/CN1 connectors:
    -DENC_A=22
    -DENC_B=27
    -DENC_SW=35
    ; no joystick (GPIO35 has no pull-up, the rest are used) - dummy pins keep the code compiling
    -DNO_JOY
    -DJOY_X=34
    -DJOY_Y=35
    -DJOY_SW=17
    ; the page sprite is 8-bit (76.8 KB) so it fits in internal RAM next to WiFi
    -DSPRITE_DEPTH=8
    ; touch = the real XPT2046_Touchscreen library (works in the remote-only build), time-shared with the SD card (see touch.h)
    -DTOUCH_USE_LIB
    ; ---- less load / heat ----
    ; WiFi TX 11 dBm (less current spikes on the weak USB supply). Remove this line if the WiFi signal is too weak.
    -DWIFI_TX_LOW
    ; video buffer reserved at boot (KB) and RAM always left to WiFi + web server (KB); lower POOL if WiFi gets unstable
    -DLIGHT_POOL_KB=72
    -DLIGHT_RESERVE_KB=80
    ; other switches:  -DCPU_FULL_SPEED (always 240 MHz)   -DWIFI_SLEEP (WiFi modem sleep, default is now OFF)   -DTOUCH_NO_FALLBACK

; ---- DEFAULT: ST7789 CYD (most boards with 2 USB ports: micro + type-C) ----
[env:cyd]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000

; ---- OTA build: two 1.9 MB app slots. Flash THIS env once by cable; afterwards upload
;      .pio/build/cyd_ota/firmware.bin from the web panel (System tab > Firmware update). Settings are kept.
;      (If the firmware is too big for 1.9 MB the build says so - then keep using env:cyd.)
[env:cyd_ota]
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000

; ---- older single-USB CYD with ILI9341 panel ----
[env:cyd_ili9341]
build_flags =
    ${env.build_flags}
    -DCYD_ILI9341
    -DDISP_SPI_HZ=40000000

; ---- if the picture is noisy / sparkles ----
[env:cyd_20mhz]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=20000000

; ---- backlight is on GPIO27 on some CYD revisions (screen stays black but alive) ----
[env:cyd_bl27]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -DPIN_TFT_BL=27
    -DENC_B=16

; ---------- COLOUR fixes (use only if colours look wrong) ----------
; red and blue swapped:
[env:color_bgr]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -DDISP_RGB_ORDER=1

; colours look inverted (negative) with the default build -> use this env (DISP_INVERT=1):
[env:color_invert]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -DDISP_INVERT=1

; blocky text? use scaled classic bitmap fonts instead of the DejaVu ones:
[env:cyd_bitmap_fonts]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -DCYD_BITMAP_FONTS

; picture upside-down / mirrored:
[env:cyd_flip]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -DDISPLAY_FLIP_Y

; ---------- TOUCH tuning (XPT2046 on 25/32/39/33/36, XPT2046_Touchscreen library) ----------
; Monitor pages: tap left/right = prev/next page, swipe = next/prev, drag up/down = brightness,
; tap centre = overview/snooze alert, hold 0.8 s = auto-rotate on/off, hold 2.5 s = night mode.
; Remote page : tap a button, swipe / tap the < > strip = tab, tap the blue header left/right = prev/next page.
; Serial monitor shows 'touch: z=.. irq=..' every 10 s and 'touch raw=..' on every press (z>=400 pressed, irq=0 pressed).
; If swipes go the wrong way add (in any env):  -DTOUCH_INV_X  -DTOUCH_INV_Y  -DTOUCH_SWAP_XY
; If touch never reacts, also try:  -DTOUCH_NO_IRQ
[env:cyd_touch_inv_x]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -DTOUCH_INV_X

; ---- fallback: bit-banged touch (software SPI, no library, no bus sharing) ----
[env:cyd_touch_bitbang]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -UTOUCH_USE_LIB

; ---- touch X and Y both reversed ----
[env:cyd_touch_inv]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -DTOUCH_INV_X
    -DTOUCH_INV_Y

; ---------- WiFi/AP keeps dropping or the board resets when WiFi starts = power problem ----------
; Use a good USB cable / port first. This env only switches the brown-out reset off for testing.
[env:cyd_nobrownout]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -DCYD_NO_BROWNOUT

; ---------- page sprite in RAM = flicker-free pages. Its 77 KB is shared with the video buffer, but it is allocated at boot, so if the board
; restarts on this env (see 'RESET REASON' in the serial monitor) go back to env:cyd ----------
[env:cyd_sprite]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -DCYD_USE_SPRITE

; ---------- faster video: panel SPI 80 MHz (ST7789 often works; if the picture is noisy go back to env:cyd) ----------
[env:cyd_80mhz]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=80000000

; ---------- LVGL UI (animated gauges, chart, remote buttons, swipe pages) ----------
; Opt-in build: the classic UI stays in env:cyd.  RAM: LVGL pool 40 KB + 2 x 15 KB draw buffers, so the video buffer is smaller here.
[env:cyd_lvgl]
extra_scripts = pre:lvgl_inc.py
lib_deps =
    ${env.lib_deps}
    lvgl/lvgl@~8.3.11
; the LVGL builds keep WiFi TX power reduced (see WIFI_TX_POWER in main.cpp: 15 dBm) - a big cause of random resets on a weak USB port
build_unflags =
    -DLIGHT_POOL_KB=72
    -DLIGHT_RESERVE_KB=80
    -Os
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -DUSE_LVGL
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; RAM plan (no PSRAM, ~230 KB free at boot), everything below is reserved at boot BEFORE WiFi starts:
    ;   LVGL pool 48 KB + 2 draw buffers 12.8 KB + SD video buffer 24 KB + UI task 12 KB  -> ~95 KB stays for WiFi, web server, JSON, SD upload buffer
    ; LVGL pool: the deck UI builds 10 keys + gradient tiles + icons. If the serial log shows 'lvgl: ... free=' under ~6000, raise to 40.
    -DLV_MEM_KB=32
    -DCORE_DEBUG_LEVEL=0
    ; video frame buffer (also the SD-upload buffer): 32 KB = frames up to 30 KB = much better JPEG quality than 16 KB. -DLIGHT_POOL_KB=16 gives the RAM back.
    ; the buffer is allocated LAST and only from what is left above the reserve: it shrinks by itself instead of starving WiFi / the web server
    -DLIGHT_POOL_KB=32
    -DLIGHT_RESERVE_KB=48
    ; -O2 instead of the default -Os: the JPEG decoder (TJpg_Decoder) and LVGL run roughly 20-30 % faster
    -O2
    ; stack of the UI task (LVGL + web server + wifi). The serial log prints uiStackFree every 10 s.
    -DUI_TASK_STACK=8192
    -DPH_ONE_BUF
    ; optional: -DLV_CPU_160 (cooler, slower UI)   -DWIFI_SLEEP (radio naps: cooler but the IP can become unreachable)   -DWIFI_TX_POWER=WIFI_POWER_11dBm (weaker WiFi, less current)

; ---------- LVGL "Days til" countdown app (default LVGL UI, src/lvgl_ui_daystil.h) ----------
[env:cyd_daystil]
extends = env:cyd_lvgl
build_flags =
    ${env:cyd_lvgl.build_flags}
    -DUI_DAYSTIL

; ---------- LVGL card dashboard: CPU / RAM / network tabs (src/lvgl_ui_dash.h) ----------
[env:cyd_dash]
extends = env:cyd_lvgl
build_flags =
    ${env:cyd_lvgl.build_flags}
    -DUI_DASH

; ---------- your previous LVGL UI (src/lvgl_ui_orig.h) ----------
[env:cyd_lvgl_orig]
extends = env:cyd_lvgl
build_flags =
    ${env:cyd_lvgl.build_flags}
    -DUI_ORIG

; ---------- phone-style UI: lock screen, home, apps, control center (src/lvgl_ui_phone.h) ----------
[env:cyd_phone]
extends = env:cyd_lvgl
build_flags =
    ${env:cyd_lvgl.build_flags}
    -DUI_PHONE

; ---------- Stream Deck style UI: LCD keys, profiles, folders, touch strip, Reel (SD video/GIF/photo) (src/lvgl_ui_deck.h) ----------
[env:cyd_deck]
extends = env:cyd_lvgl
build_flags =
    ${env:cyd_lvgl.build_flags}
    -DUI_DECK

; ---------- Stream Deck UI, SAFE mode: 160 MHz CPU = less current -> fewer brown-out restarts on a weak USB port ----------
; Use this if the serial monitor says "RESET REASON: BROWN-OUT" or the board restarts while uploading.
[env:cyd_deck_safe]
extends = env:cyd_lvgl
build_flags =
    ${env:cyd_lvgl.build_flags}
    -DUI_DECK
    -DLV_CPU_160

; ---------- Stream Deck UI, FAST VIDEO: panel SPI 80 MHz + SD card 40 MHz (more fps, sharper video) ----------
; If the picture sparkles go back to cyd_deck (panel 40 MHz); if the SD card shows read errors use the 20 MHz default again.
[env:cyd_deck_fast]
extends = env:cyd_lvgl
build_flags =
    ${env:cyd_lvgl.build_flags}
    -DUI_DECK
    -UDISP_SPI_HZ
    -DDISP_SPI_HZ=80000000
    -USD_SPI_HZ
    -DSD_SPI_HZ=40000000

; ---------- Stream Deck UI, LITE: smallest RAM use (6 profiles, 16 KB video buffer, no icons in RAM, monogram letters instead) ----------
; Use it when the web page still stops answering. Everything else works as in cyd_deck_fast.
[env:cyd_deck_lite]
extends = env:cyd_deck_fast
build_flags =
    ${env:cyd_deck_fast.build_flags}
    -DRMT_TABS=6
    -ULIGHT_POOL_KB
    -DLIGHT_POOL_KB=16
    -DDK_ICON_MIN_HEAP=99999999
